name: Terraform production destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to tear down the application stack"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghost-production-aws-terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform

jobs:
  destroy:
    name: Plan and destroy application stack
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ghost_image: ${{ vars.GHOST_IMAGE }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_r2_bucket_name: ${{ vars.R2_BUCKET_NAME }}
      TF_VAR_r2_media_hostname: ${{ vars.R2_MEDIA_HOSTNAME }}
      TF_VAR_r2_credentials_secret_arn: ${{ vars.R2_CREDENTIALS_SECRET_ARN }}
      TF_VAR_allow_data_destruction: "true"
      TF_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ghost-production-aws/terraform.tfstate

    steps:
      - name: Validate manual destroy request
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Select the main branch when running this workflow."
            exit 1
          fi
          if [[ "${CONFIRM_DESTROY}" != "DESTROY" ]]; then
            echo "Confirmation must be exactly DESTROY."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: terraform-destroy-${{ github.run_id }}

      - name: Initialize the remote backend
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=${TF_STATE_KEY}"
          -backend-config="region=${TF_VAR_aws_region}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Create saved destroy plan
        run: terraform plan -destroy -input=false -no-color -out=destroy.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Display saved destroy plan
        run: terraform show -no-color destroy.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Apply the exact destroy plan
        run: terraform apply -input=false -no-color destroy.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
