name: Terraform production apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
      - "README.md"
      - "terraform/modules/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-production-aws-terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform

jobs:
  apply:
    name: Apply reviewed production plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ghost_image: ${{ vars.GHOST_IMAGE }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_r2_bucket_name: ${{ vars.R2_BUCKET_NAME }}
      TF_VAR_r2_media_hostname: ${{ vars.R2_MEDIA_HOSTNAME }}
      TF_VAR_r2_credentials_secret_arn: ${{ vars.R2_CREDENTIALS_SECRET_ARN }}
      TF_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ghost-production-aws/terraform.tfstate

    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}

      - name: Initialize the remote backend
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=${TF_STATE_KEY}"
          -backend-config="region=${TF_VAR_aws_region}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Create saved production plan
        run: terraform plan -input=false -no-color -out=production.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Display saved production plan
        run: terraform show -no-color production.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Apply the exact saved plan
        run: terraform apply -input=false -no-color production.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
