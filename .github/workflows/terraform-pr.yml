name: Terraform pull request

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
      - "README.md"
      - "terraform/modules/README.md"

# Static validation must remain safe for forked pull requests. It receives only
# repository read access; the separate plan job is the sole OIDC consumer.
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform

jobs:
  static:
    name: Static Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Initialize without the remote backend
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Validate Terraform configuration
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --format compact
        working-directory: ${{ env.TF_WORKING_DIR }}

  plan:
    name: Speculative Terraform plan
    needs: static
    # Never expose AWS credentials or an OIDC token to forked pull-request code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ghost-production-aws-terraform-state
      cancel-in-progress: false
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ghost_image: ${{ vars.GHOST_IMAGE }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_r2_bucket_name: ${{ vars.R2_BUCKET_NAME }}
      TF_VAR_r2_media_hostname: ${{ vars.R2_MEDIA_HOSTNAME }}
      TF_VAR_r2_credentials_secret_arn: ${{ vars.R2_CREDENTIALS_SECRET_ARN }}
      TF_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ghost-production-aws/terraform.tfstate

    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: terraform-plan-pr-${{ github.event.pull_request.number }}

      - name: Initialize the remote backend
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=${TF_STATE_KEY}"
          -backend-config="region=${TF_VAR_aws_region}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Create speculative plan
        run: terraform plan -input=false -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}
